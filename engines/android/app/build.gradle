import java.util.Properties

plugins {
    id "com.android.application"
}

def projectSigningPropertiesFile = rootProject.file("signing.properties")
if (!projectSigningPropertiesFile.isFile()) {
    throw new GradleException(
        "缺少项目固定签名配置：" + projectSigningPropertiesFile
                + "。请复制 signing.properties.example 为 signing.properties，并放入对应 keystore。"
    )
}

def projectSigningProperties = new Properties()
projectSigningPropertiesFile.withInputStream { stream ->
    projectSigningProperties.load(stream)
}

def requiredProjectSigningProperty = { name ->
    def value = projectSigningProperties.getProperty(name)
    if (value == null || value.trim().isEmpty()) {
        throw new GradleException(
            "项目固定签名配置缺少 " + name + "：" + projectSigningPropertiesFile
        )
    }
    return value.trim()
}

def projectSigningStoreFile = rootProject.file(
        requiredProjectSigningProperty("storeFile")
)
if (!projectSigningStoreFile.isFile()) {
    throw new GradleException("项目固定签名文件不存在：" + projectSigningStoreFile)
}

android {
    namespace "com.xiaoyv.engine"
    compileSdk 34

    buildFeatures {
        aidl true
    }

    signingConfigs {
        xiaoyv {
            storeFile projectSigningStoreFile
            storePassword requiredProjectSigningProperty("storePassword")
            keyAlias requiredProjectSigningProperty("keyAlias")
            keyPassword requiredProjectSigningProperty("keyPassword")
            storeType projectSigningProperties.getProperty("storeType", "PKCS12")
        }
    }

    defaultConfig {
        applicationId "com.xiaoyv.engine"
        minSdk 23
        targetSdk 34
        versionCode 1
        versionName "0.1.0"

        externalNativeBuild {
            cmake {
                cppFlags "-std=c++17 -Wall -Wextra"
            }
        }
    }

    externalNativeBuild {
        cmake {
            path file("src/main/cpp/CMakeLists.txt")
            version "3.22.1"
        }
    }

    packaging {
        jniLibs {
            // Root app_process 没有 APK PathClassLoader 的 native 搜索路径，需要安装后可按
            // applicationInfo.nativeLibraryDir 绝对加载同一份 libengine.so。
            useLegacyPackaging = true
            // OpenCV 与 ONNX Runtime 的 Java API 仍随基础包保留；大体积 native 本体改由
            // /sdcard/xiaoyv/extensions 中用户导入的文件在脚本实际使用时按需加载。
            // onnxruntime4j_jni 是约数十 KB 的 Java 绑定 JNI 壳，保留在 APK 内以便官方
            // Java 绑定稳定找到它，再链接已导入的 libonnxruntime.so。
            excludes += [
                    "**/libc++_shared.so",
                    "**/libopencv_java4.so",
                    "**/libonnxruntime.so"
            ]
        }
        resources {
            // JavaMail 与 Activation 都携带同名许可证元数据；运行时不读取这些文件。
            excludes += ["META-INF/LICENSE.md", "META-INF/NOTICE.md"]
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.xiaoyv
        }
        release {
            signingConfig signingConfigs.xiaoyv
        }
    }

    flavorDimensions += "abi"
    productFlavors {
        arm64 {
            dimension "abi"
            ndk {
                abiFilters "arm64-v8a"
            }
        }
        x64 {
            dimension "abi"
            ndk {
                abiFilters "x86_64"
            }
        }
    }
}

androidComponents {
    beforeVariants(selector().withBuildType("debug")) { variantBuilder ->
        def enableX64Debug = project.findProperty("xiaoyvEnableX64Debug")
                ?.toString()?.toBoolean() ?: false
        if (!enableX64Debug && variantBuilder.productFlavors.any { it.second == "x64" }) {
            variantBuilder.enable = false
        }
    }
}

dependencies {
    implementation "androidx.core:core:1.13.1"
    // 让 WebView 在 HTML 的首段脚本执行前注入 xiaoyv，页面可直接在初始化阶段调用 UI 桥。
    implementation "androidx.webkit:webkit:1.11.0"
    // HTTP、HTTPS 与 WebSocket 共用一套连接池；接口形状在 Lua 兼容层固定。
    implementation "com.squareup.okhttp3:okhttp:4.12.0"
    // 懒人精灵兼容 LuaEngine 邮件接口沿用 JavaMail；activation 提供附件 MIME 数据源。
    implementation "com.sun.mail:android-mail:1.6.7"
    implementation "com.sun.mail:android-activation:1.6.7"
    // 兼容 unZip 的密码与 charset 参数；普通 APK assets 解包仍使用系统流式 ZIP。
    implementation "net.lingala.zip4j:zip4j:2.11.5"
    // 懒人兼容 findCircle 直接使用官方 Android AAR 的霍夫圆检测。
    implementation "org.opencv:opencv:4.9.0"
    // RapidOCR 的内置与自定义 ONNX 模型都由 Android ONNX Runtime 执行。
    implementation "com.microsoft.onnxruntime:onnxruntime-android:1.18.0"
}
